name: Test invalid qemu timeout validation
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create mock QEMU and esptool so we can reach the timeout validation
      - name: Create mock QEMU and esptool
        run: |
          mkdir -p ./qemu-git/build
          cat > ./qemu-git/build/qemu-system-xtensa << 'EOF'
          #!/bin/bash
          echo "fake qemu running"
          sleep 1
          EOF
          chmod +x ./qemu-git/build/qemu-system-xtensa

          mkdir -p ./esptool
          cat > ./esptool/esptool.py << 'EOF'
          #!/usr/bin/env python3
          print("fake esptool running")
          EOF
          chmod +x ./esptool/esptool.py

      # Create a build folder with all required files so we reach timeout validation
      - name: Create build folder with all required files
        run: |
          mkdir -p ./test-build
          cat > ./test-build/partitions.csv << 'EOF'
          # Name,   Type, SubType, Offset,  Size, Flags
          nvs,      data, nvs,     0x9000,  0x5000,
          otadata,  data, ota,     0xe000,  0x2000,
          app0,     app,  ota_0,   0x10000, 0x140000,
          spiffs,   data, spiffs,  0x290000,0x170000,
          EOF
          # Create dummy binary files
          dd if=/dev/zero bs=1024 count=4 of=./test-build/firmware.bin 2>/dev/null
          dd if=/dev/zero bs=1024 count=4 of=./test-build/partitions.bin 2>/dev/null
          dd if=/dev/zero bs=1024 count=4 of=./test-build/bootloader.bin 2>/dev/null
          dd if=/dev/zero bs=1024 count=4 of=./test-build/boot_app0.bin 2>/dev/null

      - name: Run action with invalid timeout (non-numeric)
        id: action
        uses: .
        with:
          build-folder: ./test-build
          flash-size: "4"
          qemu-timeout: "not-a-number"
          firmware-bin: firmware.bin
          partitions-bin: partitions.bin
          bootloader-bin: bootloader.bin
          otadata-bin: boot_app0.bin
          partitions-csv: partitions.csv
        continue-on-error: true

      - name: Assert action failed due to invalid timeout
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid timeout 'not-a-number'"
            exit 1
          fi
          echo "PASS: action correctly rejected invalid timeout value"
