name: Test invalid flash size validation
on:
  workflow_dispatch:

jobs:
  test-invalid-flash-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a minimal build folder with required files so we get past
      # the folder/file checks and reach the flash size validation
      - name: Create minimal build folder with required files
        run: |
          mkdir -p ./build
          # Minimal partitions.csv with required sections
          cat > ./build/partitions.csv << 'EOF'
          # Name,   Type, SubType, Offset,  Size, Flags
          nvs,      data, nvs,     0x9000,  0x5000,
          otadata,  data, ota,     0xe000,  0x2000,
          app0,     app,  ota_0,   0x10000, 0x140000,
          spiffs,   data, spiffs,  0x290000,0x170000,
          EOF
          touch ./build/firmware.bin
          touch ./build/partitions.bin
          touch ./build/bootloader.bin
          touch ./build/boot_app0.bin
          touch ./build/spiffs.bin

      - name: Run action with invalid flash size (expect failure)
        id: action
        uses: .
        with:
          chip: esp32
          flash-size: "99"
          build-folder: ./build
          qemu-timeout: "10"
        continue-on-error: true

      - name: Assert action failed due to invalid flash size
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid flash size but it succeeded"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid flash size"
