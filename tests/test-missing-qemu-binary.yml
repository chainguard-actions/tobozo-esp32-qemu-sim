name: Test missing QEMU binary error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Without a pre-built QEMU binary, the action should fail with
      # "qemu binary is missing for esp32". We verify the action fails
      # (not succeeds silently) when the QEMU binary is absent.
      # The cache step will miss (no prior cache), and the checkout+build
      # steps will run but we skip the build by providing a fake cache hit
      # via a pre-created stub directory so the build step is skipped,
      # then the run step fails because the binary doesn't actually exist.
      - name: Create stub qemu-git directory to skip build step
        run: |
          mkdir -p ./qemu-git/build
          # Do NOT create the actual binary — we want the "missing binary" error

      - id: action
        uses: .
        continue-on-error: true
        with:
          chip: esp32
          qemu-timeout: "5"
          flash-image: /dev/null

      - name: Assert action failed due to missing QEMU binary
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with missing QEMU binary, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly detected missing QEMU binary"
