name: Test missing flash image validation
on:
  workflow_dispatch:

jobs:
  test-missing-flash-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with valid chip but missing flash image
        id: action
        uses: .
        continue-on-error: true
        with:
          chip: esp32
          flash-image: /nonexistent/flash_image.bin

      - name: Assert action failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action will fail either because:
          # 1. QEMU binary is missing (cache miss, no build), OR
          # 2. Flash image file not found
          # Both are valid failure modes for this scenario
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed (qemu binary missing or flash image not found)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed - flash image does not exist"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
