name: Test missing build folder validation
on:
  workflow_dispatch:

jobs:
  test-missing-build-folder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with valid chip but missing build folder
        id: action
        uses: .
        continue-on-error: true
        with:
          chip: esp32
          build-folder: /nonexistent/build

      - name: Assert action failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action will fail because:
          # 1. QEMU binary is missing (cache miss, no build), OR
          # 2. Build folder not found
          # Both are valid failure modes for this scenario
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed (qemu binary missing or build folder not found)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed - build folder does not exist"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
