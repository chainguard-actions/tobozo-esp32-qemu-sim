name: Test missing build folder validation
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action requires a build folder with compiled ESP32 binaries.
      # Without actual ESP32 firmware, the action should fail with a clear error
      # about the missing build folder. We test that validation works correctly.
      - id: action
        uses: .
        continue-on-error: true
        with:
          build-folder: ./nonexistent-build-folder
          qemu-timeout: "5"

      - name: Assert action failed gracefully on missing build folder
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected when build folder is missing"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed with missing build folder"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
