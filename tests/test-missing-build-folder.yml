name: Test missing build folder validation
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action requires QEMU and esptool to be present before it validates
      # the build folder. We mock those tools so we can test the build folder
      # validation logic.
      - name: Create mock QEMU and esptool
        run: |
          mkdir -p ./qemu-git/build
          # Create a fake qemu-system-xtensa that does nothing
          cat > ./qemu-git/build/qemu-system-xtensa << 'EOF'
          #!/bin/bash
          echo "fake qemu running"
          sleep 1
          EOF
          chmod +x ./qemu-git/build/qemu-system-xtensa

          mkdir -p ./esptool
          # Create a fake esptool.py that does nothing
          cat > ./esptool/esptool.py << 'EOF'
          #!/usr/bin/env python3
          print("fake esptool running")
          EOF
          chmod +x ./esptool/esptool.py

      - name: Run action with non-existent build folder
        id: action
        uses: .
        with:
          build-folder: ./nonexistent-build-folder
          qemu-timeout: "5"
        continue-on-error: true

      - name: Assert action failed due to missing build folder
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when build folder does not exist"
            exit 1
          fi
          echo "PASS: action correctly failed when build folder does not exist"
