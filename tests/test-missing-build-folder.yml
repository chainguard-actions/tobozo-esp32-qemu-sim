name: Test missing build folder validation
on:
  workflow_dispatch:

jobs:
  test-missing-build-folder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with non-existent build folder (expect failure)
        id: action
        uses: .
        with:
          chip: esp32
          build-folder: ./nonexistent-build-folder
          qemu-timeout: "10"
        continue-on-error: true

      - name: Assert action failed due to missing build folder
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with missing build folder but it succeeded"
            exit 1
          fi
          echo "PASS: action correctly failed for missing build folder"
