name: Test invalid chip name validation
on:
  workflow_dispatch:

jobs:
  test-invalid-chip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid chip name
        id: action
        uses: .
        continue-on-error: true
        with:
          chip: invalid-chip
          flash-image: /nonexistent/flash.bin

      - name: Assert action failed due to invalid chip
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed for invalid chip name"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed for invalid chip name 'invalid-chip'"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
