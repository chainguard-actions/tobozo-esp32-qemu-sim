name: Test invalid chip name validation
on:
  workflow_dispatch:

jobs:
  test-invalid-chip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action validates chip name early (before QEMU binary check).
      # An invalid chip name should cause the action to fail with a clear error.
      - name: Run action with invalid chip name (expect failure)
        id: action
        uses: .
        with:
          chip: esp32invalid
          build-folder: ./build
        continue-on-error: true

      - name: Assert action failed due to invalid chip
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid chip name, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid chip name"
