name: Test ESP32 QEMU - Invalid Chip Name
on:
  workflow_dispatch:

jobs:
  test-invalid-chip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action's shell script validates the chip name early.
      # Passing an invalid chip name should cause the action to fail
      # with "Invalid chip name" error message.
      # Note: The script runs after QEMU/Python setup steps, so the action
      # will still go through those setup steps before reaching chip validation.
      - id: action
        uses: .
        continue-on-error: true
        with:
          chip: invalid-chip
          flash-size: "4"
          qemu-timeout: "10"
          build-folder: ./build

      - name: Assert action failed due to invalid chip
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed for invalid chip name"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed for invalid chip 'invalid-chip'"
            exit 1
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
