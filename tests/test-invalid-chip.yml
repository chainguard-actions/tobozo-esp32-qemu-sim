name: Test invalid chip name rejection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action should fail fast when an invalid chip name is provided.
      # We use continue-on-error so we can assert on the outcome.
      - id: action
        uses: .
        continue-on-error: true
        with:
          chip: invalid-chip
          qemu-timeout: "5"

      - name: Assert action failed due to invalid chip
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid chip name, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected invalid chip name"
