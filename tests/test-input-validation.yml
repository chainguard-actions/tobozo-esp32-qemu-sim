name: Test ESP32 QEMU input validation
on:
  workflow_dispatch:

jobs:
  test-input-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a minimal build folder with required files so the action
      # can progress past folder/CSV validation and reach binary validation.
      # The action will fail when it cannot find esptool.py or qemu binary,
      # which is the expected behavior in a non-ESP32 environment.
      - name: Create minimal build folder with partitions.csv
        run: |
          mkdir -p ./build
          # Minimal partitions.csv with required otadata and app0 entries
          cat > ./build/partitions.csv << 'EOF'
          # Name,   Type, SubType, Offset,  Size, Flags
          nvs,      data, nvs,     0x9000,  0x5000,
          otadata,  data, ota,     0xe000,  0x2000,
          app0,     app,  ota_0,   0x10000, 0x140000,
          spiffs,   data, spiffs,  0x290000,0x170000,
          EOF
          # Create dummy binary files (not real ESP32 binaries, just placeholders)
          dd if=/dev/zero bs=1024 count=4 of=./build/bootloader.bin 2>/dev/null
          dd if=/dev/zero bs=1024 count=4 of=./build/partitions.bin 2>/dev/null
          dd if=/dev/zero bs=1024 count=4 of=./build/firmware.bin 2>/dev/null
          dd if=/dev/zero bs=1024 count=4 of=./build/boot_app0.bin 2>/dev/null
          echo "Build folder contents:"
          ls -la ./build/

      # The action requires QEMU and esptool to be built/present.
      # Under act, these won't be available, so the action will fail
      # at the tool validation stage. We run with continue-on-error
      # and assert the failure is due to missing tools (expected).
      - name: Run action (expected to fail - missing QEMU/esptool)
        id: action
        uses: .
        continue-on-error: true
        with:
          debug: "true"
          flash-size: "4"
          psram: "disabled"
          qemu-timeout: "5"
          build-folder: ./build
          bootloader-address: "0x1000"
          partitions-address: "0x8000"
          spiffs-address: "0x290000"
          partitions-csv: partitions.csv
          otadata-bin: boot_app0.bin
          firmware-bin: firmware.bin
          partitions-bin: partitions.bin
          bootloader-bin: bootloader.bin
          spiffs-bin: spiffs.bin

      - name: Assert action failed as expected (missing QEMU/esptool tools)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          # The action is expected to fail because QEMU and esptool are not
          # available in the act environment (they require building from source).
          # A 'failure' outcome confirms the action correctly validates tools.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: Action failed as expected due to missing QEMU/esptool tools"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: Action succeeded (QEMU and esptool were available)"
          else
            echo "FAIL: Unexpected outcome '$OUTCOME'"
            exit 1
          fi
