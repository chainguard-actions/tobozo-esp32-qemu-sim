name: Test missing binary files validation
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create mock QEMU and esptool so we can test binary file validation
      - name: Create mock QEMU and esptool
        run: |
          mkdir -p ./qemu-git/build
          cat > ./qemu-git/build/qemu-system-xtensa << 'EOF'
          #!/bin/bash
          echo "fake qemu running"
          sleep 1
          EOF
          chmod +x ./qemu-git/build/qemu-system-xtensa

          mkdir -p ./esptool
          cat > ./esptool/esptool.py << 'EOF'
          #!/usr/bin/env python3
          print("fake esptool running")
          EOF
          chmod +x ./esptool/esptool.py

      # Create a build folder with partitions.csv but missing binary files
      - name: Create build folder with partitions.csv only
        run: |
          mkdir -p ./test-build
          # Create a minimal partitions.csv with required entries
          cat > ./test-build/partitions.csv << 'EOF'
          # Name,   Type, SubType, Offset,  Size, Flags
          nvs,      data, nvs,     0x9000,  0x5000,
          otadata,  data, ota,     0xe000,  0x2000,
          app0,     app,  ota_0,   0x10000, 0x140000,
          spiffs,   data, spiffs,  0x290000,0x170000,
          EOF

      - name: Run action with missing firmware binary
        id: action
        uses: .
        with:
          build-folder: ./test-build
          firmware-bin: firmware.bin
          partitions-bin: partitions.bin
          bootloader-bin: bootloader.bin
          otadata-bin: boot_app0.bin
          partitions-csv: partitions.csv
          qemu-timeout: "5"
        continue-on-error: true

      - name: Assert action failed due to missing binary files
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when binary files are missing"
            exit 1
          fi
          echo "PASS: action correctly failed when binary files are missing"
