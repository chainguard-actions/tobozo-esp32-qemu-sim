name: Test basic invocation with default inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a minimal build folder with required files so the action
      # can pass early validation checks before reaching the QEMU stage.
      # The binaries are dummy (zero-byte) files — sufficient for path checks.
      - name: Create dummy build artifacts
        run: |
          mkdir -p ./build
          # Minimal valid partitions.csv with required partition names
          cat > ./build/partitions.csv << 'EOF'
          # Name,   Type, SubType, Offset,  Size, Flags
          nvs,      data, nvs,     0x9000,  0x5000,
          otadata,  data, ota,     0xe000,  0x2000,
          app0,     app,  ota_0,   0x10000, 0x140000,
          spiffs,   data, spiffs,  0x290000,0x170000,
          EOF
          # Dummy binary files (not real ESP32 binaries, but present for path checks)
          dd if=/dev/zero bs=1 count=256 of=./build/firmware.bin 2>/dev/null
          dd if=/dev/zero bs=1 count=256 of=./build/partitions.bin 2>/dev/null
          dd if=/dev/zero bs=1 count=256 of=./build/bootloader.bin 2>/dev/null
          dd if=/dev/zero bs=1 count=256 of=./build/boot_app0.bin 2>/dev/null
          dd if=/dev/zero bs=1 count=256 of=./build/spiffs.bin 2>/dev/null
          echo "Build folder contents:"
          ls -la ./build/

      # The action will fail because QEMU cannot be built in this environment,
      # but we verify it starts correctly and reaches the expected failure point.
      - id: action
        uses: .
        continue-on-error: true
        with:
          debug: "true"
          flash-size: "4"
          psram: "disabled"
          qemu-timeout: "10"
          build-folder: ./build
          bootloader-address: "0x1000"
          partitions-address: "0x8000"
          spiffs-address: "0x290000"
          partitions-csv: partitions.csv
          otadata-bin: boot_app0.bin
          firmware-bin: firmware.bin
          partitions-bin: partitions.bin
          bootloader-bin: bootloader.bin
          spiffs-bin: spiffs.bin

      - name: Assert action ran (even if it failed at QEMU build)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          # The action is expected to fail in this environment because
          # building QEMU from source requires a full build toolchain.
          # We accept both 'success' and 'failure' as valid outcomes,
          # but not 'skipped' or empty (which would indicate the step never ran).
          if [ "$OUTCOME" = "skipped" ] || [ -z "$OUTCOME" ]; then
            echo "FAIL: action step was skipped or did not run"
            exit 1
          fi
          echo "PASS: action step ran with outcome=$OUTCOME"
