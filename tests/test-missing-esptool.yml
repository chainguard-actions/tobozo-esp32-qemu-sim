name: Test missing esptool validation
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Run the action without setting up esptool or QEMU.
      # The action's run-build-in-qemu.sh checks for esptool.py first
      # and should fail with "esptool.py is missing".
      - name: Run action without esptool present
        id: action
        uses: .
        with:
          build-folder: ./build
          qemu-timeout: "5"
        continue-on-error: true

      - name: Assert action failed due to missing esptool
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when esptool.py is missing"
            exit 1
          fi
          echo "PASS: action correctly failed when esptool.py is missing"
