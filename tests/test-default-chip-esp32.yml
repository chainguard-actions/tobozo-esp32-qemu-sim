name: Test default chip esp32
on:
  workflow_dispatch:

jobs:
  test-default-chip-esp32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The default chip is esp32 which is valid. The action will fail later
      # (missing QEMU binary or missing build folder), but should pass chip validation.
      - name: Run action with default chip esp32 (expect failure at QEMU/build check)
        id: action
        uses: .
        with:
          chip: esp32
          build-folder: ./build
        continue-on-error: true

      - name: Assert action failed (not due to invalid chip)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail (no QEMU binary or build folder), but NOT because of
          # invalid chip name. We verify the action ran and produced an outcome.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed at a later stage (chip validation passed for esp32)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: default chip name esp32 was accepted"
