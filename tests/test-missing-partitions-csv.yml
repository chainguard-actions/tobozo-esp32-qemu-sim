name: Test missing partitions.csv rejection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a build folder without partitions.csv to trigger validation error
      - name: Create empty build folder
        run: mkdir -p ./build

      # The action validates that partitions.csv exists in the build folder.
      # A missing partitions.csv should cause the action to fail.
      - id: action
        uses: .
        continue-on-error: true
        with:
          chip: esp32
          build-folder: ./build
          partitions-csv: partitions.csv
          qemu-timeout: "5"

      - name: Assert action failed with missing partitions.csv
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with missing partitions.csv, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with missing partitions.csv"
