name: Test missing partitions.csv validation
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a build folder WITHOUT partitions.csv to test that specific validation
      - name: Create build folder without partitions.csv
        run: |
          mkdir -p ./build
          # Only create binary files, NOT partitions.csv
          dd if=/dev/zero bs=1024 count=4 of=./build/bootloader.bin
          dd if=/dev/zero bs=1024 count=4 of=./build/firmware.bin
          dd if=/dev/zero bs=1024 count=4 of=./build/partitions.bin
          dd if=/dev/zero bs=1024 count=4 of=./build/boot_app0.bin
          # Intentionally NOT creating partitions.csv

      - id: action
        uses: .
        continue-on-error: true
        with:
          build-folder: ./build
          flash-size: "4"
          qemu-timeout: "5"

      - name: Assert action failed on missing partitions.csv
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected when partitions.csv is missing"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed with missing partitions.csv"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
