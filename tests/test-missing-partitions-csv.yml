name: Test missing partitions.csv validation
on:
  workflow_dispatch:

jobs:
  test-missing-partitions-csv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a build folder WITHOUT partitions.csv to trigger that validation
      - name: Create build folder without partitions.csv
        run: |
          mkdir -p ./build
          # Intentionally NOT creating partitions.csv
          touch ./build/firmware.bin
          touch ./build/partitions.bin
          touch ./build/bootloader.bin
          touch ./build/boot_app0.bin
          touch ./build/spiffs.bin

      - name: Run action with missing partitions.csv (expect failure)
        id: action
        uses: .
        with:
          chip: esp32
          build-folder: ./build
          partitions-csv: partitions.csv
          qemu-timeout: "10"
        continue-on-error: true

      - name: Assert action failed due to missing partitions.csv
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with missing partitions.csv but it succeeded"
            exit 1
          fi
          echo "PASS: action correctly failed for missing partitions.csv"
