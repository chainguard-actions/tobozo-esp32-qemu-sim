name: Test esp32s3 chip variant
on:
  workflow_dispatch:

jobs:
  test-chip-esp32s3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with esp32s3 chip and missing flash image
        id: action
        uses: .
        continue-on-error: true
        with:
          chip: esp32s3
          flash-image: /nonexistent/flash_image.bin

      - name: Assert action failed gracefully (not due to invalid chip name)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # esp32s3 is a valid chip name, so the action should NOT fail with
          # "Invalid chip name" — it should fail later (qemu binary missing or flash image not found).
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (qemu binary missing or flash image not found, not invalid chip)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed - no QEMU binary or flash image available"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
